# Checks the code of a pull request and of main: lint, the tests that run without ManimGL's rendering or network services, the
# generated files, and the guide's conventions.
name: check-code

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # manimpango has no Linux wheel: it builds against Pango
      - run: sudo apt-get update && sudo apt-get install -y libpango1.0-dev pkg-config
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -m "not render and not network"
      - run: uv run python scripts/release.py --check
      - run: uv run python scripts/check_guide.py
